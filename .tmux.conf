# ===========================================================================
#  TMUX — Minimalist, Industrial Config.
# ===========================================================================

# ── TRUE COLOR (24-bit) ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ── GENERAL ──────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0              # No delay after Escape (critical for nvim)
set -g base-index 1                # Windows start at 1
set -g pane-base-index 1           # Panes start at 1
set -g renumber-windows on         # Re-number when a window is closed
setw -g mode-keys vi               # Vi mode in copy mode
set -g focus-events on

# ── SYSTEM-DARK STATUS BAR ───────────────────────────────────────────
set -g status-position bottom
set -g status-style "fg=#8a8a8a,bg=#1c1c1c" # Dark charcoal background, muted gray text

# Left: Session name in a solid block
set -g status-left "#[fg=#ffffff,bg=#303030,bold] #S #[fg=#303030,bg=#1c1c1c] "
set -g status-left-length 30

# Right: Basic ISO timestamp (No bloat)
set -g status-right "#[fg=#767676] %Y-%m-%d %H:%M "
set -g status-right-length 40

# Window tabs (Muted gray when inactive, high-contrast block when active)
set -g window-status-format "#[fg=#767676,bg=#1c1c1c] #I:#W "
set -g window-status-current-format "#[fg=#ffffff,bg=#3a3a3a,bold] #I:#W "
set -g window-status-separator ""

# Pane Borders (Blends seamlessly into dark terminal backgrounds)
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#444444"

# ══════════════════════════════════════════════════════════════════════
#  PLUGINS (TPM)
# ══════════════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
